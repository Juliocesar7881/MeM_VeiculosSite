# Publica o site na Cloudflare (mm-veiculos.lupinho7881.workers.dev) a cada push na main.
# Também pode ser disparado à mão: GitHub > Actions > "Deploy na Cloudflare" > Run workflow.
#
# Requer o secret CLOUDFLARE_API_TOKEN (GitHub > Settings > Secrets and variables > Actions),
# um token da conta com permissão de editar Workers e D1. CLOUDFLARE_ACCOUNT_ID é opcional.
name: Deploy na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-producao
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verifica o token da Cloudflare
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Deploy não executado: falta o secret CLOUDFLARE_API_TOKEN no repositório."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Instala dependências
        if: steps.token.outputs.ok == 'true'
        run: npm ci

      # Migrations novas no D1 remoto + build para Workers + wrangler deploy (scripts/cf.ts).
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: npm run cf:deploy
